<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAC 地址表速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><p class="meta">参考卡 · 002</p><h1>MAC 地址表：已知目的地址的转发</h1><table><tr><th>术语</th><th>含义</th></tr><tr><td>帧</td><td>本课指以太网的数据单元，包含源 MAC 和目的 MAC。</td></tr><tr><td>交换机接口</td><td>本课指接网线的接口，不是 TCP/UDP 端口。</td></tr><tr><td>MAC 地址表</td><td>记录 MAC 地址与可达接口的对应关系；完整表还包括 VLAN 等信息。</td></tr></table><p class="focus">本课条件：同一 VLAN、正常二层转发、已知单播目的地址、出口与入口不同。先看目的 MAC，再查对应接口，从该接口转发。</p><p>未知目的地址、源地址学习及老化另学，不能把“每次只发一个接口”推广到所有帧。</p><p><a href="https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/12-2_58_se/configuration/guide/2960scg/swadmin.html">来源：Cisco MAC 地址表说明</a></p><footer><a href="../lessons/0002-mac-table-lookup.html">返回第二课</a> · <a href="network-forwarding.html">交换与路由速查卡</a></footer></main></body></html>
