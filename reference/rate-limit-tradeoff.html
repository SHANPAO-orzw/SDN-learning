<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上报限速取舍速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>降低积压，也要观察合法影响</h1><p>本课模型：允许上报=min(需求,阈值)，超额丢弃；合法进入=允许上报×合法占比。比例分配为额外假设，不是实际限速器保证。</p><p>限速是数量管控，不自动识别攻击。合法上报也可能被丢弃，影响新规则及时建立；进入控制器不等于完成处理或业务成功。</p><p>进入量等于能力时，不新增积压，但已有积压也不会消退。进入量小于能力时，已有积压才能逐步清理。</p><p><a href="https://opennetworking.org/wp-content/uploads/2014/10/openflow-spec-v1.3.2.pdf">原始参考：OpenFlow 1.3.2 §6.2</a> · <a href="../lessons/0012-rate-limit-tradeoff.html">返回第十二课</a></p></main></body></html>
