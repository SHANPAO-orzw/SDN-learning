<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下一跳与最终目标速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>最终目标与本地下一跳</h1><p>普通 IPv4 以太网中，先查路由确定下一跳，再在本地解析它的 MAC。</p><table><tr><th>场景</th><th>下一跳</th><th>ARP 解析对象</th></tr><tr><td>同子网直接通信</td><td>目标主机</td><td>目标主机的 IP → MAC</td></tr><tr><td>跨网络，经网关</td><td>网关的本地接口</td><td>该接口的 IP → MAC</td></tr></table><p>无 NAT、隧道等特殊机制时，给远端服务器的数据在本地发出时：目的 IP 是远端服务器；目的 MAC 是本地下一跳接口。地址缓存有效时无需每次重发 ARP。</p><p><a href="https://www.rfc-editor.org/rfc/rfc826.html">依据：RFC 826</a> · <a href="../lessons/0006-next-hop-mac.html">返回第六课</a></p></main></body></html>
