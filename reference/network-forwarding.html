<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交换与路由速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><p class="meta">参考卡 · 001</p><h1>交换与路由</h1><table><tr><th>术语</th><th>本课程使用的含义</th></tr><tr><td>二层交换机</td><td>在局域网内转发以太网帧，主要依据目的 MAC 地址和转发表。</td></tr><tr><td>路由器</td><td>依据目的 IP 地址与路由表，在不同 IP 网络之间转发数据包。</td></tr><tr><td>网关</td><td>本课中，主机把发往其他网络的数据交给的路由设备接口。</td></tr></table><p>同一子网的两台主机，经交换机即可通信；跨网络通信需要路由功能。设备外壳名称不等于它只承担一种功能。</p><p><a href="https://www.cisco.com/site/us/en/learn/topics/small-business/network-switch-vs-router.html">来源：Cisco</a> · <a href="../lessons/0001-switch-and-router.html">返回第一课及练习</a></p></main></body></html>
