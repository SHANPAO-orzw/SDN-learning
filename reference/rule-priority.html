<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>优先级速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>先匹配，再比优先级</h1><ol><li>排除条件不匹配的规则。</li><li>在匹配规则中选数值最高的优先级。</li><li>执行选中规则的指令／动作，不依次执行所有匹配规则。</li></ol><p>限定单张 OpenFlow 表。更具体不自动获胜，先安装也不自动获胜。重叠匹配且相同最高优先级时，OpenFlow 1.3.2不保证选择哪条，应避免依赖此配置。</p><p><a href="https://opennetworking.org/wp-content/uploads/2014/10/openflow-spec-v1.3.2.pdf">原始依据：ONF OpenFlow 1.3.2 §5.3</a> · <a href="../lessons/0009-rule-priority.html">返回第九课</a></p></main></body></html>
