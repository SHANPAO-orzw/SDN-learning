<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同子网 ARP 速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>ARP 与 MAC 表</h1><p>本卡限定 IPv4 普通以太网、同一子网内通信，无代理 ARP 等特殊配置。</p><table><tr><th>主机 ARP 缓存</th><th>交换机 MAC 表</th></tr><tr><td>IPv4 → MAC</td><td>MAC → 接口，按 VLAN 区分</td></tr><tr><td>确定本地下一跳的目的 MAC</td><td>确定帧的出口</td></tr></table><p>目标映射无有效缓存时：广播请求（以太网目的为 ff:ff:ff:ff:ff:ff）→ 目标通常单播回复 → 发送方获得映射。</p><p>未知单播泛洪不改变单播目的 MAC；ARP 普通查询的广播目的 MAC 则从发送时就已确定。</p><p><a href="https://www.rfc-editor.org/rfc/rfc826.html">依据：RFC 826</a> · <a href="../lessons/0005-arp-local.html">返回第五课与练习</a></p></main></body></html>
