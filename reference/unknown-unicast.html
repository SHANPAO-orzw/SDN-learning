<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未知单播速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>未知单播泛洪</h1><p>先学源 MAC 与入接口，再查目的 MAC。目的地址未知时，在同一 VLAN 内向除入口外、允许转发的接口复制发送。这里假设未配置泛洪阻断等限制。</p><p>泛洪不改变原来的单播目的 MAC，也不等于向其他网络无限发送。</p><table><tr><th>目的查表结果</th><th>本例动作</th></tr><tr><td>已知，且出口不同于入口</td><td>从对应接口发出</td></tr><tr><td>未知</td><td>同一 VLAN 内除入口外的转发接口各发一份</td></tr></table><p><a href="https://www.cisco.com/c/en/us/support/docs/switches/catalyst-6000-series-switches/23563-143.html">依据：Cisco 官方文档</a></p><footer><a href="../lessons/0004-unknown-unicast.html">返回第四课与练习</a> · <a href="mac-learning.html">源 MAC 学习</a> · <a href="../index.html">目录</a></footer></main></body></html>
