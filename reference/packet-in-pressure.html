<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packet-In资源压力速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>看上报量，不只看总流量</h1><p>假设每个未匹配帧均上送且不受限：上报量=总帧数×未匹配比例。若持续到达量大于处理能力，队列可能增长。</p><p>本课自定义队列模型：Q下一秒=max(0,Q本秒+到达−处理能力)。非真实设备性能测量，不模拟容量限制、丢包或CPU使用率。</p><p>风险涉及控制连接、控制器处理与待处理消息资源；新规则建立可能延迟，已有规则转发不一定立即停止。大量上报也可能源于正常业务或配置，不能单凭数量认定攻击。</p><p><a href="https://opennetworking.org/wp-content/uploads/2014/10/openflow-spec-v1.3.2.pdf">依据：OpenFlow 1.3.2 §6.2 的限速与拒绝服务风险说明</a> · <a href="../lessons/0011-packet-in-pressure.html">返回第十一课</a></p></main></body></html>
