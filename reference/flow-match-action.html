<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流表匹配与动作速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>匹配条件 → 动作</h1><p>匹配条件回答“哪些数据适用”；动作回答“匹配后怎样处理”。</p><p>例：目的 MAC = B → 输出接口2。也可以配置为丢弃，命中规则并不等于一定转发。</p><p>本课是单表简化模型：一条具体规则，兜底丢弃。实际 OpenFlow 流项还包含优先级、计数器和指令等；未匹配处理取决于具体配置，不能直接套用普通学习交换机的泛洪逻辑。</p><p><a href="https://opennetworking.org/wp-content/uploads/2014/10/openflow-spec-v1.3.2.pdf">ONF OpenFlow 1.3.2，5.2–5.4</a> · <a href="../lessons/0008-flow-match-action.html">返回第八课</a></p></main></body></html>
