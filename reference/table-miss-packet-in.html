<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table-miss 与 Packet-In 速查卡</title><link rel="stylesheet" href="../assets/course.css"></head><body><main><h1>未匹配不等于必然上报</h1><table><tr><th>状态</th><th>本课处理</th></tr><tr><td>有有效的具体匹配规则</td><td>执行该规则</td></tr><tr><td>无具体匹配，兜底上送控制器</td><td>发送 Packet-In</td></tr><tr><td>无具体匹配，兜底丢弃</td><td>丢弃，不自动上报</td></tr></table><p>Packet-In：交换机发往控制器的消息，可携带数据包全部或部分内容及上下文。控制器再根据策略决定是否建立规则。</p><p>安装规则与交付首帧不是同一个动作。本实验不模拟首帧缓存或Packet-Out；真实机制可能处理首帧，不要据此认为首帧必丢。</p><p>这里仅研究table-miss触发的Packet-In；其他显式规则等也可以触发它。</p><p><a href="https://opennetworking.org/wp-content/uploads/2014/10/openflow-spec-v1.3.2.pdf">ONF OpenFlow 1.3.2 §5.4、§6.1.2</a> · <a href="../lessons/0010-table-miss-packet-in.html">返回第十课</a></p></main></body></html>
